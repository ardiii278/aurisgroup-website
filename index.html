<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURIS Group | Architecture, Interior & Construction</title>
    <meta name="description" content="AURIS Group - Perusahaan tepercaya di bidang konstruksi, desain interior, dan event. Solusi terintegrasi dengan standar profesionalisme tinggi di Jakarta Selatan.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- Preloader -->
    <div id="preloader">
        <div class="loader">
            <div class="loader-logo">
                <img src="logo.svg" alt="AURIS Group" class="loader-logo-img">
            </div>
            <div class="loader-bar"></div>
        </div>
    </div>

    <!-- Navigation -->
    <header id="navbar">
        <div class="container nav-container">
            <a href="#" class="logo">
                <img src="logo.svg" alt="AURIS Group" class="logo-img">
            </a>
            <nav class="nav-menu" id="navMenu"></nav>
            <a href="#contact" class="btn btn-nav" id="navCta"></a>
            <button class="hamburger" id="hamburger">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-particles"></div>
        <div class="container hero-content">
            <div id="heroInner"></div>
        </div>
        <div class="hero-scroll">
            <a href="#about"><i class="fas fa-chevron-down"></i></a>
        </div>
    </section>

    <!-- About Section -->
    <section id="about" class="about section">
        <div class="container">
            <div class="about-grid" id="aboutGrid"></div>
        </div>
    </section>

    <!-- Services Section -->
    <section id="services" class="services section">
        <div class="container">
            <div id="servicesInner"></div>
        </div>
    </section>

    <!-- Why Choose Us Section -->
    <section class="why-us section">
        <div class="container">
            <div class="why-us-grid" id="whyUsGrid"></div>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="projects section">
        <div class="container">
            <div id="projectsInner"></div>
        </div>
    </section>

    <!-- Stats Section -->
    <section class="stats section">
        <div class="container">
            <div class="stats-grid" id="statsGrid"></div>
        </div>
    </section>

    <!-- Testimonials Section -->
    <section id="testimonials" class="testimonials section">
        <div class="container">
            <div id="testimonialsInner"></div>
        </div>
    </section>

    <!-- CTA Section -->
    <section class="cta section">
        <div class="container">
            <div id="ctaInner"></div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact section">
        <div class="container">
            <div id="contactHeader"></div>
            <div class="contact-grid">
                <div class="contact-info" id="contactInfo" data-aos="fade-right"></div>
                <div class="contact-form-wrapper" data-aos="fade-left">
                    <form class="contact-form" id="contactForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="name">Nama Lengkap</label>
                                <input type="text" id="name" placeholder="Masukkan nama Anda" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">No. Telepon</label>
                                <input type="tel" id="phone" placeholder="08xx-xxxx-xxxx" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="email@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="service">Layanan yang Dibutuhkan</label>
                            <select id="service" required>
                                <option value="">Pilih Layanan</option>
                                <option value="konstruksi-bangunan">Konstruksi Bangunan</option>
                                <option value="interior-design">Interior Design</option>
                                <option value="instalasi-elektrikal">Instalasi Elektrikal</option>
                                <option value="irigasi-drainase">Irigasi & Drainase</option>
                                <option value="event-organizer">Event Organizer</option>
                                <option value="arsitektur">Arsitektur & Perencanaan Struktur</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="message">Pesan</label>
                            <textarea id="message" rows="4" placeholder="Ceritakan kebutuhan proyek Anda..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">
                            <span>Kirim Pesan</span>
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container" id="footerInner"></div>
    </footer>

    <!-- Back to Top -->
    <a href="#home" class="back-to-top" id="backToTop">
        <i class="fas fa-chevron-up"></i>
    </a>

    <!-- WhatsApp Float -->
    <a href="https://wa.me/6285771895172" class="whatsapp-float" id="waFloat" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Project Gallery Modal -->
    <div id="galleryModal" class="gallery-modal" aria-hidden="true">
        <div class="gallery-modal-backdrop" data-close-gallery></div>
        <div class="gallery-modal-content" role="dialog" aria-modal="true">
            <button class="gallery-modal-close" data-close-gallery aria-label="Tutup">
                <i class="fas fa-times"></i>
            </button>
            <div id="galleryModalBody"></div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" aria-hidden="true">
        <button class="lightbox-close" id="lightboxClose" aria-label="Tutup"><i class="fas fa-times"></i></button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Sebelumnya"><i class="fas fa-chevron-left"></i></button>
        <img id="lightboxImg" src="" alt="Galeri proyek">
        <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Berikutnya"><i class="fas fa-chevron-right"></i></button>
        <div class="lightbox-counter" id="lightboxCounter"></div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
